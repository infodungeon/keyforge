id: no-raw-as-casts
message: "Precision Leakage: Avoid raw 'as' casts in physics kernels. Use deterministic conversion traits or f32::from/f64::from instead."
severity: error
language: rust
rule:
  all:
    - pattern: "$VAL as $TYPE"
    - not:
        any:
          - inside:
              kind: mod_item
              has:
                kind: attribute
                pattern: "#[cfg(test)]"
          - pattern: "$X as i128"
          - pattern: "$X as u128"
          - pattern: "$X as f64"
files:
  - "libs/keyforge-physics/src/**/*.rs"
  - "libs/keyforge-evolution/src/**/*.rs"
  - "libs/keyforge-model/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "ops/repros/**"
  - "ops/templates/**"
  - "libs/keyforge-model/src/types/**/*.rs"
  - "libs/keyforge-protocol/src/types/**/*.rs"
  - "libs/keyforge-persistence/src/**/*.rs"
  - "libs/keyforge-model/src/geometry/kle.rs"
  - "libs/keyforge-physics/src/kernel/compute/analysis.rs"
