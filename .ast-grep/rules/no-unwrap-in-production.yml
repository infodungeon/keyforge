id: no-unwrap-in-production
message: "TYPE-003: Production code must not use .unwrap(). Use Result and ForgeError instead."
severity: error
language: rust
rule:
  all:
    - pattern: "$OBJ.unwrap()"
    - not:
        inside:
          any:
            - kind: mod_item
              has:
                kind: attribute
                pattern: "#[cfg(test)]"
            - kind: function_item
              has:
                kind: attribute
                pattern: "#[test]"
            - kind: function_item
              has:
                kind: attribute
                pattern: "#[tokio::test]"
            - kind: function_item
              has:
                kind: attribute
                pattern: "#[keyforge_testing_macros::kf_test]"
            - kind: function_item
              has:
                kind: attribute
                pattern: "#[bench]"
files:
  - "libs/**/*.rs"
  - "apps/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "ops/repros/**"
  - "**/common/**"
  - "**/testing.rs"
  - "**/mock.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
  - "libs/keyforge-testing/**"
  - "**/*_bench.rs"
  - "**/benches/**"
  - "**/main.rs" # Sometimes allowed in binaries for setup, but we prefer handling. Keeping for now to avoid noise.
