description = "Perform a systemic audit with automatic GitHub documentation of findings."

prompt = """
Execute a Parallel Systemic Audit.

### Step 1: Background Reconcile
!{
    ./ops/scripts/reconcile_tasks.sh
}

### Step 2: Systemic Scan
!{
    ./ops/scripts/dispatch_task.sh "CargoClippy" "cargo clippy --workspace -- -D warnings"
    ast-grep scan --json > .ast-grep-results.json
}

### Step 3: Automatic GitHub Synchronization
1. **Analyze Results**: Parse `.ast-grep-results.json` and count violations.
2. **Sync Issues**: For each unique violation type:
   - Check if an [ARCH-AUDIT] issue exists using `gh issue list`.
   - If not, create it.
   - If yes, update the description with the latest count.
3. **Project Update**: Ensure all audit issues are on the 'KeyForge 100x Roadmap'.

Audit dispatched. I will report the GitHub sync status once the scan is processed.
"""