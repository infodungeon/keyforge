# KeyForge Systemic Law (The Constitution)
# Enforces architectural invariants via Narsil Security Engine

name: KeyForge Systemic Law
version: "1.1.0"
description: Consolidated enforcement of Hexagonal Purity, Determinism, Safety, and Performance.

rules:
  # --- ARCHITECTURAL LAWS (ARCH-00x) ---

  - id: ARCH-001
    name: UI Purity
    severity: High
    rule_type:
      type: pattern
      patterns:
        - '\.split\(.*\)\.map\(.*\)' # heuristic for data transformation in components
        - 'JSON\.parse\(.*\)'
      safe_patterns:
        - 'useJobDispatch'
        - 'useArena'
    languages: ["typescript", "typescriptreact"]
    message: "Data transformation detected in UI component. Components must be pure views."
    remediation: "Move transformation logic to a dedicated service layer or custom hook."
    enabled: true
    tags: ["architecture", "ui", "purity"]

  - id: ARCH-002
    name: Slim Handlers
    severity: High
    rule_type:
      type: pattern
      patterns:
        - 'pub async fn \w+\(.*\) -> .* \{(\n\s+.*){10,}\}' # strict: >10 lines
    languages: ["rust"]
    message: "Fat Handler detected (>10 lines). API handlers must delegate to domain services."
    remediation: "Extract logic into a Domain Service or Use Case in `keyforge-model`."
    enabled: true
    tags: ["architecture", "clean-code"]

  - id: ARCH-003
    name: Deterministic Physics
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - 'f32'
        - 'f64'
      safe_patterns:
        - '#[cfg(test)]'
        - 'libs/keyforge-infra'
        - 'apps/keyforge-ui'
    languages: ["rust"]
    message: "Floating point detected in logic kernel. Physics must be bit-perfect deterministic."
    remediation: "Use `i64` fixed-point math via the `Score` type."
    enabled: true
    tags: ["architecture", "determinism", "physics"]

  - id: ARCH-003-PRECISION
    name: Intermediate Precision Guard
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - '\.raw\(\)\s*\*'
        - '\*.*\.raw\(\)'
        - 'i64\s*\*\s*i64'
      safe_patterns:
        - 'i128::from'
        - 'as i128'
        - '#\[cfg\(test\)\]'
        - '// SAFETY: i128'
        - 'libs/keyforge-infra'
    languages: ["rust"]
    message: "Potential overflow in fixed-point math. Raw i64 multiplication detected in compute kernel."
    remediation: "Promote operands to `i128` before multiplication or use `Score` domain methods (e.g., `checked_mul_weight`)."
    enabled: true
    tags: ["architecture", "determinism", "physics"]

  - id: ARCH-004
    name: Compile-Time SQL
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - 'sqlx::query\('
        - 'query\("'
      safe_patterns:
        - 'sqlx::query!\('
        - 'sqlx::query_as!\('
    languages: ["rust"]
    message: "Raw SQL string or unverified query detected. All SQL must be verified at compile time."
    remediation: "Use `sqlx::query!` or `sqlx::query_as!` macros."
    enabled: true
    tags: ["architecture", "security", "sql"]

  - id: ARCH-005
    name: Hexagonal Purity Violation
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - 'std::fs::'
        - 'std::net::'
        - 'std::process::'
        - 'tokio::fs::'
        - 'tokio::net::'
        - 'println!'
        - 'eprintln!'
        - 'dbg!'
      safe_patterns:
        - '#[cfg(test)]'
    languages: ["rust"]
    message: "IO or Side-Effect detected in Pure Kernel."
    remediation: "Move IO to `keyforge-infra` or `keyforge-adapter`. Inject dependencies via Traits."
    enabled: true
    tags: ["architecture", "purity", "hexagonal"]

  - id: ARCH-006
    name: Structural Oracle
    severity: High
    rule_type:
      type: pattern
      patterns:
        - 'const \w+: &str = ".*"' # heuristic for hardcoded system nouns
      safe_patterns:
        - 'keyforge_protocol::'
    languages: ["rust", "typescript"]
    message: "Potential hardcoded system noun or contract string. Use the Structural Oracle."
    remediation: "Define constants/types in `keyforge-protocol` and use shared traits/bindings."
    enabled: true
    tags: ["architecture", "structural-oracle"]

  # --- TYPE & RELIABILITY LAWS (TYPE-00x) ---

  - id: TYPE-003
    name: Panic-Free Production
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - '\.unwrap\(\)'
        - '\.expect\('
        - 'panic!\('
        - 'unreachable!\('
        - 'todo!\('
      safe_patterns:
        - '#[cfg(test)]'
        - '// SAFETY:'
    languages: ["rust"]
    message: "Panic-inducing call detected. Production code must handle all errors."
    remediation: "Use `Result`, `Option`, or `match`. If impossible, add `// SAFETY:` comment with proof."
    enabled: true
    tags: ["reliability", "panic-free", "production"]

  - id: TYPE-002
    name: Total Error Propagation
    severity: High
    rule_type:
      type: pattern
      patterns:
        - 'Box<dyn Error>'
      safe_patterns:
        - 'ForgeError'
    languages: ["rust"]
    message: "Generic error type detected. Use the project-standard ForgeError."
    remediation: "Implement `From` for your error type into `ForgeError` or use `ForgeError` directly."
    enabled: true
    tags: ["reliability", "error-handling"]

