# KeyForge Systemic Law (The Constitution)
# Enforces architectural invariants via Narsil Security Engine

name: KeyForge Systemic Law
version: "1.0.0"
description: Enforcement of Hexagonal Purity, Panic Freedom, and Determinism

rules:
  # ARCH-005: Hexagonal Purity (No IO in Kernels)
  - id: ARCH-005
    name: Hexagonal Purity Violation
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - 'std::fs::'
        - 'std::net::'
        - 'std::process::'
        - 'tokio::fs::'
        - 'tokio::net::'
        - 'println!'
        - 'eprintln!'
        - 'dbg!'
      safe_patterns:
        - '#[cfg(test)]'
    languages: ["rust"]
    message: "IO or Side-Effect detected in Pure Kernel. Physics/Evolution must be pure logic."
    remediation: "Move IO to `keyforge-infra` or `keyforge-adapter`. Inject dependencies via Traits."
    enabled: true
    tags: ["architecture", "purity", "hexagonal"]

  # TYPE-003: Panic Freedom (No Unwrap)
  - id: TYPE-003
    name: Panic-Free Production
    severity: Critical
    rule_type:
      type: pattern
      patterns:
        - '\.unwrap\(\)'
        - '\.expect\('
        - 'panic!\('
        - 'unreachable!\('
        - 'todo!\('
      safe_patterns:
        - '#[cfg(test)]'
        - '// SAFETY:'
    languages: ["rust"]
    message: "Panic-inducing call detected. Production code must handle all errors."
    remediation: "Use `Result`, `Option`, or `match`. If impossible, add `// SAFETY:` comment with proof."
    enabled: true
    tags: ["reliability", "panic-free", "production"]

  # ARCH-002: No Fat Handlers
  - id: ARCH-002
    name: Fat Handler Detection
    severity: High
    rule_type:
      type: pattern
      patterns:
        - 'pub async fn \w+\(.*\) -> .* \{(\n\s+.*){20,}\}' # heuristic: >20 lines
    languages: ["rust"]
    message: "Potential Fat Handler detected. Handlers should delegate to Core Logic immediately."
    remediation: "Extract logic into a Domain Service or Use Case in `keyforge-model`."
    enabled: false # Disabled until regex is tuned
    tags: ["architecture", "clean-code"]

