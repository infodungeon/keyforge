[policy]
name = "search_safety"
description = "Enforces safe search practices to prevent context crashes from large regression files."

[[rule]]
id = "exclude_regressions"
description = "Always exclude proptest-regressions from any recursive search."
enforcement = "mandatory"
patterns = ["**/proptest-regressions/**"]

[[rule]]
id = "prefer_ripgrep"
description = "Use search_file_content instead of raw grep to ensure .geminiignore is respected."
enforcement = "preferred"
