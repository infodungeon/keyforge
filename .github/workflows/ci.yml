name: KeyForge CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libssl-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Mock Sidecar
        run: |
          mkdir -p apps/keyforge-ui/src-tauri/binaries
          touch apps/keyforge-ui/src-tauri/binaries/keyforge-agent-x86_64-unknown-linux-gnu
          chmod +x apps/keyforge-ui/src-tauri/binaries/keyforge-agent-x86_64-unknown-linux-gnu

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Technical Debt Sentinel
        run: ./ops/scripts/check_debt_integrity.sh

      - name: Install Cargo Audit & Deny
        run: |
          cargo install cargo-audit
          cargo install cargo-deny

      - name: Security & Dependency Audit
        run: |
          cargo audit
          cargo deny check --config deny.toml

      - name: Lint
        run: cargo clippy --workspace -- -D warnings

      - name: Architecture Guardrails
        run: python3 ops/scripts/check_arch.py

      - name: 100x Master Audit
        run: python3 ops/scripts/audit_master.py

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: docs/planning/audit_results/expanded/
          retention-days: 30

      - name: Build Core/Hive/CLI
        run: cargo build --release --workspace --exclude keyforge-ui

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Tests
        env:
          DATABASE_MAX_CONNECTIONS: 20
          DATABASE_TIMEOUT_SECONDS: 15
          RATE_LIMIT_PER_SEC: 100
        run: |
          just test-all

  ui-check:
    name: UI Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/keyforge-ui/package-lock.json
      - name: Install Dependencies
        run: cd apps/keyforge-ui && npm install
      - name: Check Types
        run: cd apps/keyforge-ui && npx tsc --noEmit
      - name: Check Formatting
        run: cd apps/keyforge-ui && npx prettier --check .

  test-arm64:
    name: ARM64 Test Suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Physics Tests (NEON)
        run: |
          cargo test -p keyforge-physics --lib engines::arm_neon

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run Coverage
        env:
          DATABASE_MAX_CONNECTIONS: 20
          DATABASE_TIMEOUT_SECONDS: 15
          RATE_LIMIT_PER_SEC: 100
          SQLX_OFFLINE: true
        run: cargo tarpaulin --workspace --exclude keyforge-ui --out Xml -- --test-threads 1

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: tarpaulin-report.xml
          fail_ci_if_error: false

  build-app:
    name: Build App
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: |
          cd apps/keyforge-ui
          npm install

      # OPS-030: Code Signing (Placeholder for Secrets)
      # In production, inject certificates here via secrets
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KeyForge ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: ./apps/keyforge-ui
