[workspace]
resolver = "2"
members = [
    "apps/keyforge-agent",
    "apps/keyforge-assetmgr",
    "apps/keyforge-assets",
    "apps/keyforge-cli",
    "apps/keyforge-hive",
    "apps/keyforge-tui",
    "apps/keyforge-ui/src-tauri",
    "corpora/openbookcorpus",
    "libs/keyforge-adapter",
    "libs/keyforge-compute",
    "libs/keyforge-evolution",
    "libs/keyforge-export",
    "libs/keyforge-infra",
    "libs/keyforge-model",
    "libs/keyforge-persistence",
    "libs/keyforge-physics",
    "libs/keyforge-protocol",
    "libs/keyforge-security",
    "libs/keyforge-testing",
    "libs/keyforge-wasm",
    "ops/repros",
    "tests/system",
]

[workspace.package]
version = "0.9.0"
authors = ["KeyForge Team"]
license = "Apache-2.0"
repository = "https://github.com/keyforge-project/keyforge"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "fs", "io-util"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
proptest = "1.9"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "json",
    "uuid",
] }
utoipa = { version = "5.4", features = ["preserve_order", "preserve_path_order"] }
strum = { version = "0.27", features = ["derive"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
tempfile = "3.24"
fastrand = "2.3"
zstd = "0.13"
rmp-serde = "1.3"
postcard = { version = "1.0", features = ["use-std"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
backoff = { version = "0.4", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
wiremock = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
futures = "0.3"
futures-util = "0.3"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = "2.1"
raw-cpuid = "11.6"
fs2 = "0.4"
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit", "request-id", "util"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
validator = { version = "0.20", features = ["derive"] }
dotenvy = "0.15"
tokio-stream = { version = "0.1", features = ["net"] }
notify = "8.2"
bytes = "1.11"
kle-serial = "0.3"
rand_xoshiro = "0.7"
rand_chacha = "0.9"
tauri = { version = "2.2" }
tauri-build = { version = "2.0" }
tauri-plugin-shell = { version = "2.2" }
once_cell = "1.21"
pin-project-lite = "0.2"
dashmap = "6.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tower = "0.5"
rust-embed = { version = "8.6", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
image = { version = "0.25", features = ["png", "jpeg"] }
md-5 = "0.10"
itertools = "0.14"
ordered-float = { version = "5.0", features = ["serde"] }
regex = "1.12"
crc32fast = "1.5"
subtle = "2.6"
cobs = "0.3"
heapless = "0.7"
serde-big-array = "0.5"
csscolorparser = "0.7"
smallvec = "1.15"
temp-env = "0.3"
ctrlc = "3.4"
sqlx-postgres = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "json", "uuid"] }
sqlx-macros = { version = "0.8" }
sqlx-core = { version = "0.8" }
sqlx-rt = { version = "0.8" }
sqlx-test = { version = "0.8" }
sqlx-mysql = { version = "0.8" }
sqlx-sqlite = { version = "0.8" }
sqlx-any = { version = "0.8" }
sqlx-offline = { version = "0.8" }
sqlx-migrate = { version = "0.8" }
axum-core = { version = "0.5" }
tokio-util = { version = "0.7" }
tower-layer = { version = "0.3" }
tower-service = { version = "0.3" }
http = { version = "1.2" }
http-body = { version = "1.0" }
http-body-util = { version = "0.1" }
hyper = { version = "1.5" }
hyper-util = { version = "0.1" }
tokio-native-tls = "0.3"
native-tls = "0.2"
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
reqwest-tracing = "0.5"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipa-axum = { version = "0.2" }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.16", features = ["postgres"] }
argon2 = "0.5"
url = { version = "2.5", features = ["serde"] }
deadpool = "0.12"
r2d2 = "0.8"
bb8 = "0.9"
axum-extra = { version = "0.10", features = ["typed-header"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-test = "0.2"
criterion = { version = "0.5", features = ["async_tokio"] }
governor = "0.8"
mockall = "0.13"
serial_test = "3.2"
test-log = { version = "0.2", features = ["trace"] }
base64 = "0.22"
bitflags = "2.6"
getrandom = "0.2"
syn = "2.0"
hashbrown = "0.15"
num_cpus = "1.16"
sysinfo = "0.33"
local-ip-address = "0.6"
hostname = "0.4"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower_governor = "0.8.0"
tikv-jemallocator = "0.6"
toml = "0.8"
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32.0"
testcontainers = "0.26.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
dirs = "6.0"