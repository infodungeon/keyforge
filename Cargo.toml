[workspace]
resolver = "2"
members = [
    "apps/keyforge-agent",
    "apps/keyforge-assetmgr",
    "apps/keyforge-assets",
    "apps/keyforge-cli",
    "apps/keyforge-hive",
    "apps/keyforge-tui",
    "apps/keyforge-ui/src-tauri",
    "corpora/openbookcorpus",
    "libs/keyforge-adapter",
    "libs/keyforge-compute",
    "libs/keyforge-evolution",
    "libs/keyforge-export",
    "libs/keyforge-infra",
    "libs/keyforge-model",
    "libs/keyforge-persistence",
    "libs/keyforge-physics",
    "libs/keyforge-protocol",
    "libs/keyforge-security",
    "libs/keyforge-testing",
    "libs/keyforge-testing-macros",
    "libs/keyforge-wasm",
    "ops/repros",
    "tests/system",
]

[workspace.package]
version = "0.9.0"
authors = ["KeyForge Team"]
license = "Apache-2.0"
repository = "https://github.com/keyforge-project/keyforge"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# TYPE-003: No Panics
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"

# ARCH-005: Purity (No direct IO/printing in logic)
print_stdout = "deny"
print_stderr = "deny"

# TYPE-004: Type Safety (Mandatory audit for data loss)
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"

# API Quality
missing_errors_doc = "warn"
must_use_candidate = "warn"

pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "fs", "io-util"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
proptest = "1.9"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "json",
    "uuid",
] }
utoipa = { version = "5.4", features = ["preserve_order", "preserve_path_order"] }
strum = { version = "0.27", features = ["derive"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
keyforge-testing-macros = { path = "libs/keyforge-testing-macros" }
tempfile = "3.24"
fastrand = "2.3"
zstd = "0.13"
rmp-serde = "1.3"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
backon = "1.3"
fred = { version = "10.1.0", features = ["enable-rustls", "metrics"] }
chrono = { version = "0.4", features = ["serde"] }
wiremock = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.18"
parquet = "57.1"
rayon = "1.11"
rustc-hash = "2.1"
pasetors = { version = "0.7", features = ["v4"] }
getrandom = "0.2"
getrandom_v03 = { package = "getrandom", version = "0.3" }
futures = "0.3"
futures-util = "0.3"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = "2.1"
raw-cpuid = "11.6"
fs2 = "0.4"
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit", "request-id", "util"] }
