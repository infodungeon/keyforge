[workspace]
resolver = "2"
members = [
    "apps/keyforge-agent",
    "apps/keyforge-assetmgr",
    "apps/keyforge-assets",
    "apps/keyforge-cli",
    "apps/keyforge-hive",
    "apps/keyforge-ui/src-tauri",
    "corpora/openbookcorpus",
    "libs/keyforge-adapter",
    "libs/keyforge-compute",
    "libs/keyforge-core",
    "libs/keyforge-evolution",
    "libs/keyforge-export",
    "libs/keyforge-infra",
    "libs/keyforge-model",
    "libs/keyforge-persistence",
    "libs/keyforge-physics",
    "libs/keyforge-protocol",
    "libs/keyforge-runner",
    "libs/keyforge-security",
    "libs/keyforge-testing",
    "libs/keyforge-wasm",
    "ops/repros",
]

[workspace.package]
version = "0.9.0"
authors = ["KeyForge Team"]
license = "Apache-2.0"
repository = "https://github.com/keyforge-project/keyforge"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
