[workspace]
members = [
    "libs/keyforge-testing",
    "apps/keyforge-agent",
    "libs/keyforge-compute",
    "libs/keyforge-export",
    "libs/keyforge-model",
    "libs/keyforge-physics",
    "libs/keyforge-evolution",
    "apps/keyforge-hive",
    "libs/keyforge-protocol",
    "libs/keyforge-persistence",
    "libs/keyforge-infra",
    "libs/keyforge-security",
    "libs/keyforge-adapter",
    "libs/keyforge-core",
    "apps/keyforge-cli",
    "libs/keyforge-wasm",
    "apps/keyforge-ui/src-tauri",
    "corpora/openbookcorpus",
]
resolver = "2"

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.package]
version = "0.9.0"
authors = ["robert@infodungeon.com"]
license = "Apache-2.0"
description = "The KeyForge agent software."
repository = "https://github.com/..."

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
