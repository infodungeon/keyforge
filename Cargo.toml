[workspace]
resolver = "2"
members = [
    "apps/keyforge-agent",
    "apps/keyforge-assetmgr",
    "apps/keyforge-assets",
    "apps/keyforge-cli",
    "apps/keyforge-hive",
    "apps/keyforge-ui/src-tauri",
    "corpora/openbookcorpus",
    "libs/keyforge-adapter",
    "libs/keyforge-compute",
    "libs/keyforge-core",
    "libs/keyforge-evolution",
    "libs/keyforge-export",
    "libs/keyforge-infra",
    "libs/keyforge-model",
    "libs/keyforge-persistence",
    "libs/keyforge-physics",
    "libs/keyforge-protocol",
    "libs/keyforge-runner",
    "libs/keyforge-security",
    "libs/keyforge-testing",
    "libs/keyforge-wasm",
    "ops/repros",
    "tests/system",
]

[workspace.package]
version = "0.9.0"
authors = ["KeyForge Team"]
license = "Apache-2.0"
repository = "https://github.com/keyforge-project/keyforge"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
proptest = "1.9"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "json",
    "uuid",
] }
utoipa = { version = "5.4", features = ["preserve_order", "preserve_path_order"] }
strum = { version = "0.27", features = ["derive"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
