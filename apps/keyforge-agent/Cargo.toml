[package]
name = "keyforge-agent"
version = "0.8.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-core = { path = "../../libs/keyforge-core" }
keyforge-security = { path = "../../libs/keyforge-security" }
sysinfo = "0.37.2"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.0"
rayon = "1.10"
tokio = { version = "1.0", features = ["full", "tracing"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
moka = { version = "0.12", features = ["sync"] }
tokio-tungstenite = "0.28.0"
futures-util = "0.3"
url = "2.5"
opentelemetry = { version = "0.28.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.28.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.29.0"
core_affinity = "0.8"
raw-cpuid = "11.0"
libc = "0.2"
rand = "0.8.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
dirs = "6.0.0"
age = { version = "0.11", features = ["armor"] }
sha2 = "0.10"
hostname = "0.4"
secrecy = "0.10"
machine-uid = "0.5"

[dev-dependencies]
tempfile = "3.10"
