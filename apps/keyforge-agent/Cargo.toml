[package]
name = "keyforge-agent"
version = "0.8.0"
edition = "2021"

[dependencies]
keyforge-persistence = { path = "../../libs/keyforge-persistence" }
anyhow = "1.0"
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-core = { path = "../../libs/keyforge-core" }
keyforge-security = { path = "../../libs/keyforge-security" }
async-trait = "0.1"
sysinfo = "0.37.2"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
uuid = { version = "1.19", features = ["v4"] }
url = "2.5"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

raw-cpuid = "11.6"
libc = "0.2"
rand = "0.8"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
dirs = "6.0.0"
age = { version = "0.11", features = ["armor"] }
sha2 = "0.10"
hostname = "0.4"
secrecy = "0.10"
machine-uid = "0.5"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.24"
