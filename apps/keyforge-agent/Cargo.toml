[package]
name = "keyforge-agent"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "High-performance background worker agent for distributed keyboard layout optimization."
repository.workspace = true
[lints]
workspace = true

[dependencies]
keyforge-persistence = { path = "../../libs/keyforge-persistence" }
anyhow.workspace = true
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-compute = { path = "../../libs/keyforge-compute" }
keyforge-physics = { path = "../../libs/keyforge-physics" }
keyforge-security = { path = "../../libs/keyforge-security" }
async-trait.workspace = true
sysinfo.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
uuid.workspace = true
url.workspace = true
futures.workspace = true
reqwest.workspace = true

raw-cpuid.workspace = true
libc = "0.2"
rand.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
