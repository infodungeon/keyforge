[package]
name = "keyforge-assets"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "High-performance HTTP server for streaming static assets from Valkey."
repository.workspace = true
[lints]
workspace = true

[dependencies]
axum = { version = "0.8.1", features = ["http1", "http2", "tokio"] }
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
mime_guess = "2.0"
