[package]
name = "keyforge-hive"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Central orchestration server for managing KeyForge agents, UI state, and web services."
repository.workspace = true
[lints]
workspace = true

[dependencies]
crc32fast = "1.5"
tikv-jemallocator = "0.6"
postcard.workspace = true
bytes.workspace = true
mime_guess.workspace = true

# Internal
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-security = { path = "../../libs/keyforge-security" }
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
keyforge-compute = { path = "../../libs/keyforge-compute" }
keyforge-assets = { path = "../../apps/keyforge-assets" }

keyforge-persistence = { path = "../../libs/keyforge-persistence", features = [
    "server",
] }
async-trait.workspace = true

# Web Framework
axum = { workspace = true, features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tower-http = { workspace = true, features = ["cors", "trace", "fs", "limit", "request-id", "util"] }
futures.workspace = true

# Rate Limiting
tower_governor = "0.8.0"
governor.workspace = true

# Database (PostgreSQL)
sqlx.workspace = true

# Caching
moka.workspace = true

# Security
subtle = "2.6"
sha2.workspace = true
base64.workspace = true
rand.workspace = true
hex.workspace = true

# Utilities
clap.workspace = true
dirs = "6.0"
walkdir.workspace = true
notify.workspace = true
uuid.workspace = true
chrono.workspace = true
fastrand.workspace = true
sysinfo = "0.37"

# HTTP Client
reqwest.workspace = true

# Error Handling
thiserror.workspace = true
anyhow.workspace = true

# API Documentation
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

# Observability
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32.0"
metrics.workspace = true
once_cell.workspace = true
metrics-exporter-prometheus = "0.16"
tempfile.workspace = true

[dev-dependencies]
uuid.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio.workspace = true
proptest.workspace = true
tower.workspace = true
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url.workspace = true
# Valkey Integration Tests
testcontainers = "0.26.3"
testcontainers-modules = { version = "0.14.0", features = ["redis"] }
# Test Data Hydration
zstd.workspace = true
rmp-serde.workspace = true
