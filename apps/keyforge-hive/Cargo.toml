[package]
name = "keyforge-hive"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Central orchestration server for managing KeyForge agents, UI state, and web services."
repository.workspace = true
[lints]
workspace = true

[dependencies]
keyforge-testing-macros.workspace = true
crc32fast.workspace = true
tikv-jemallocator.workspace = true
postcard.workspace = true
bytes.workspace = true
mime_guess.workspace = true
zeroize.workspace = true

# Internal
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-security = { path = "../../libs/keyforge-security" }
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
keyforge-compute = { path = "../../libs/keyforge-compute" }
keyforge-physics = { path = "../../libs/keyforge-physics" }
keyforge-assets = { path = "../../apps/keyforge-assets" }

keyforge-persistence = { path = "../../libs/keyforge-persistence", features = [
    "server",
] }
async-trait.workspace = true

# Web Framework
axum = { workspace = true, features = ["ws"] }
axum-server.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tower-http = { workspace = true, features = ["cors", "trace", "fs", "limit", "request-id", "util"] }
futures.workspace = true

# Rate Limiting
tower_governor.workspace = true
governor.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "json", "ipnetwork"] }

# Caching
moka.workspace = true

# Security
subtle.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
hex.workspace = true

# Utilities
clap.workspace = true
dirs.workspace = true
walkdir.workspace = true
notify.workspace = true
uuid.workspace = true
chrono.workspace = true
fastrand.workspace = true
sysinfo.workspace = true

# HTTP Client
reqwest.workspace = true

# Error Handling
thiserror.workspace = true
anyhow.workspace = true

# API Documentation
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

# Observability
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
metrics.workspace = true
once_cell.workspace = true
metrics-exporter-prometheus.workspace = true
tempfile.workspace = true

[dev-dependencies]
uuid.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio.workspace = true
proptest.workspace = true
tower.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
# Valkey Integration Tests
testcontainers.workspace = true
testcontainers-modules.workspace = true
# Test Data Hydration
zstd.workspace = true
rmp-serde.workspace = true
