[package]
name = "keyforge-ui"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Cross-platform desktop UI for layout visualization and optimization, built with Tauri."
repository.workspace = true
[lints]
workspace = true

[lib]
name = "ui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
sysinfo = "0.37"
tauri-plugin-opener = "2.5.2"
tauri-plugin-shell = "2.3.3"
tauri-plugin-dialog = "2.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
moka = { version = "0.12", features = ["sync"] }
tokio = { version = "1.48.0", features = ["full"] }
fastrand = "2.3.0"
zstd = "0.13"
rmp-serde = "1.3"
keyforge-protocol = { path = "../../../libs/keyforge-protocol" }
keyforge-adapter = { path = "../../../libs/keyforge-adapter" }
keyforge-persistence = { path = "../../../libs/keyforge-persistence" }
keyforge-export = { path = "../../../libs/keyforge-export" }
keyforge-model = { path = "../../../libs/keyforge-model" }
keyforge-infra = { path = "../../../libs/keyforge-infra" }
keyforge-evolution = { path = "../../../libs/keyforge-evolution" }
keyforge-physics = { path = "../../../libs/keyforge-physics" }
keyforge-assets = { path = "../../keyforge-assets" }
axum = { version = "0.8.8", features = ["http1", "http2", "tokio"] }
async-trait = "0.1"
tempfile = "3.24.0"
thiserror = "2.0"
dirs = "6.0"
which = "6.0"
anyhow = "1.0"

[dev-dependencies]
reqwest = { version = "0.13.1", features = ["json"] }
