[package]
name = "openbookcorpus"
version = "0.1.0"
edition = "2021"

[dependencies]
# ADD "json" HERE:
reqwest = { version = "0.13.1", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
indicatif = "0.18.3"

# Processing dependencies
parquet = "57.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
rayon = "1.11.0"
rustc-hash = "2.1.1"
