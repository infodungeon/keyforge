[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    "RUSTSEC-2024-0411", # gdkwayland-sys unmaintained (tauri dep)
    "RUSTSEC-2024-0417", # gdkx11 unmaintained (tauri dep)
    "RUSTSEC-2024-0414", # gdkx11-sys unmaintained (tauri dep)
    "RUSTSEC-2024-0415", # gtk unmaintained (tauri dep)
    "RUSTSEC-2024-0420", # gtk-sys unmaintained (tauri dep)
    "RUSTSEC-2024-0419", # gtk3-macros unmaintained (tauri dep)
    "RUSTSEC-2025-0119", # number_prefix unmaintained (indicatif dep)
    "RUSTSEC-2024-0436", # paste unmaintained (parquet dep)
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (tauri dep)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (bollard dep)
    "RUSTSEC-2025-0081", # unic-char-property unmaintained (tauri dep)
    "RUSTSEC-2025-0075", # unic-char-range unmaintained (tauri dep)
    "RUSTSEC-2025-0080", # unic-common unmaintained (tauri dep)
    "RUSTSEC-2025-0100", # unic-ucd-ident unmaintained (tauri dep)
    "RUSTSEC-2025-0098", # unic-ucd-version unmaintained (tauri dep)
    "RUSTSEC-2024-0413", # atk unmaintained (tauri dep)
    "RUSTSEC-2024-0416", # atk-sys unmaintained (tauri dep)
    "RUSTSEC-2025-0057", # fxhash unmaintained (kuchikiki dep)
    "RUSTSEC-2024-0412", # gdk unmaintained (tauri dep)
    "RUSTSEC-2024-0418", # gdk-sys unmaintained (tauri dep)
    "RUSTSEC-2025-0141", # bincode unmaintained (narsil-mcp dep)
    "RUSTSEC-2024-0384", # instant unmaintained (narsil-mcp dep)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-DFS-2016", # Common for unicode crates
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
