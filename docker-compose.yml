services:
  # The Database
  db:
    image: postgres:16-alpine
    container_name: keyforge_db
    restart: always
    environment:
      POSTGRES_USER: keyforge
      POSTGRES_PASSWORD: forge_password
      POSTGRES_DB: keyforge_hive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Application
  hive:
    image: keyforge-hive:latest
    container_name: keyforge_hive
    restart: always
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://keyforge:forge_password@db:5432/keyforge_hive
      VALKEY_URL: redis://valkey:6379
      HIVE_SECRET: ${HIVE_SECRET:-}
      RUST_LOG: info,keyforge_hive=debug
    volumes:
      - ./data:/app/data

  # The Coordination Layer (New)
  valkey:
    image: valkey/valkey:8
    container_name: keyforge_valkey
    restart: always
    # No public ports in prod, but exposed to host for debugging if needed
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    # Persistence enabled, max memory capped to prevent OOM
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # The Web server
  web:
    build:
      context: .
      dockerfile: ops/Dockerfile.web
    container_name: keyforge_web
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      # Updated to new root-level hosts directory
      - ./hosts/sites:/usr/local/apache2/htdocs:ro
      - ./hosts/certs:/etc/apache2/ssl:ro

volumes:
  postgres_data:
  valkey_data: