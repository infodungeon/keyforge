# ==================== GLOBAL SSL SETTINGS ====================
Listen 443
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
SSLSessionCacheTimeout 300

# ==================== HTTP REDIRECT ====================
# Redirect ALL HTTP traffic to HTTPS
<VirtualHost 0.0.0.0:80>
    ServerName infodungeon.com
    # Added hive.infodungeon.com to the list
    ServerAlias www.infodungeon.com keyforge.infodungeon.com hive.infodungeon.com localhost
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# ==================== HTTPS MAIN SITE ====================
<VirtualHost 0.0.0.0:443>
    ServerName infodungeon.com
    ServerAlias www.infodungeon.com
    DocumentRoot /usr/local/apache2/htdocs/infodungeon

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    # HSTS Disabled for testing - Uncomment to enable in production
    # Header always set Strict-Transport-Security "max-age=63072000"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== HTTPS KEYFORGE SITE ====================
<VirtualHost 0.0.0.0:443>
    ServerName keyforge.infodungeon.com
    # Removed www.keyforge (invalid cert coverage)
    DocumentRoot /usr/local/apache2/htdocs/keyforge

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    # HSTS Disabled for testing
    # Header always set Strict-Transport-Security "max-age=63072000"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== HTTPS HIVE API (PROXY) ====================
<VirtualHost 0.0.0.0:443>
    ServerName hive.infodungeon.com
    ServerAlias localhost
    
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/fullchain.pem"
    SSLCertificateKeyFile "/etc/apache2/ssl/privkey.pem"

    # Forward the real Host header so Hive knows the domain
    ProxyPreserveHost On

    # 1. WebSocket Proxy
    # Must come before the root proxy
    ProxyPass /ws ws://hive:3000/ws
    ProxyPassReverse /ws ws://hive:3000/ws

    # 2. REST API Proxy
    ProxyPass / http://hive:3000/
    ProxyPassReverse / http://hive:3000/

    # Security Headers
    # Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
