# ==================== GLOBAL SSL SETTINGS ====================
Listen 443
Listen 3000
Listen 3001

SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
SSLSessionCacheTimeout 300

# ==================== HTTP REDIRECT ====================
# Redirect ALL HTTP traffic to HTTPS
<VirtualHost 0.0.0.0:80>
    ServerName infodungeon.com
    ServerAlias www.infodungeon.com keyforge.infodungeon.com localhost
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# ==================== HTTPS MAIN SITE ====================
<VirtualHost 0.0.0.0:443>
    ServerName infodungeon.com
    ServerAlias www.infodungeon.com
    DocumentRoot /usr/local/apache2/htdocs/infodungeon

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    # HSTS Disabled for testing - Uncomment to enable in production
    # Header always set Strict-Transport-Security "max-age=63072000"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== HTTPS KEYFORGE SITE ====================
<VirtualHost 0.0.0.0:443>
    ServerName keyforge.infodungeon.com
    DocumentRoot /usr/local/apache2/htdocs/keyforge

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    # HSTS Disabled for testing
    # Header always set Strict-Transport-Security "max-age=63072000"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== HTTPS HIVE API (PORT 3000) ====================
<VirtualHost *:3000>
    ServerName keyforge.infodungeon.com
    
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/fullchain.pem"
    SSLCertificateKeyFile "/etc/apache2/ssl/privkey.pem"

    # Forward the real Host header so Hive knows the domain
    ProxyPreserveHost On

    # 1. WebSocket Proxy
    ProxyPass /ws ws://hive:3000/ws
    ProxyPassReverse /ws ws://hive:3000/ws

    # 2. REST API Proxy
    ProxyPass / http://hive:3000/
    ProxyPassReverse / http://hive:3000/

    # Security Headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== HTTPS ASSETS API (PORT 3001) ====================
<VirtualHost *:3001>
    ServerName keyforge.infodungeon.com
    
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/fullchain.pem"
    SSLCertificateKeyFile "/etc/apache2/ssl/privkey.pem"

    # Forward the real Host header
    ProxyPreserveHost On

    # REST API Proxy
    ProxyPass / http://assets:3001/
    ProxyPassReverse / http://assets:3001/

    # Security Headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    # Allow CORS for Assets (Public)
    Header set Access-Control-Allow-Origin "*"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
