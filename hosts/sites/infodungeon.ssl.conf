# ==================== GLOBAL SSL SETTINGS ====================
Listen 443

SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
SSLSessionCacheTimeout 300

# ==================== HTTP REDIRECT ====================
<VirtualHost 0.0.0.0:80>
    ServerName infodungeon.com
    ServerAlias *.infodungeon.com *.keyforge.infodungeon.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# ==================== FRONTEND (keyforge.infodungeon.com) ====================
<VirtualHost *:443>
    ServerName keyforge.infodungeon.com
    DocumentRoot /usr/local/apache2/htdocs/keyforge
    
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== HIVE API (api.keyforge.infodungeon.com) ====================
<VirtualHost *:443>
    ServerName api.keyforge.infodungeon.com
    
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem
    ProxyPreserveHost On

    # WebSocket Support
    ProxyPass /ws ws://hive_upstream:3000/ws
    ProxyPassReverse /ws ws://hive_upstream:3000/ws

    # REST API
    ProxyPass / http://hive_upstream:3000/
    ProxyPassReverse / http://hive_upstream:3000/

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    
    # CORS: Allow Frontend
    Header set Access-Control-Allow-Origin "https://keyforge.infodungeon.com"
    Header set Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
    Header set Access-Control-Allow-Headers "Content-Type, X-Keyforge-Secret"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# ==================== ASSETS API (assets.keyforge.infodungeon.com) ====================
<VirtualHost *:443>
    ServerName assets.keyforge.infodungeon.com
    
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem
    ProxyPreserveHost On

    ProxyPass / http://assets_upstream:3001/
    ProxyPassReverse / http://assets_upstream:3001/

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header set Access-Control-Allow-Origin "*"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
