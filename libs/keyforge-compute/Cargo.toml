[package]
name = "keyforge-compute"
version = "0.8.0"
edition = "2021"

[dependencies]
keyforge-model = { path = "../keyforge-model" }
keyforge-protocol = { path = "../keyforge-protocol" }
keyforge-core = { path = "../keyforge-core" }
keyforge-adapter = { path = "../keyforge-adapter" }
keyforge-physics = { path = "../keyforge-physics" }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
single_threaded = ["keyforge-core/single_threaded"]
