[package]
name = "keyforge-compute"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "High-performance computation kernels and optimized math for layout analysis and scoring."
repository.workspace = true
[lints]
workspace = true

[dependencies]
keyforge-model = { path = "../keyforge-model" }
keyforge-protocol = { path = "../keyforge-protocol" }
keyforge-core = { path = "../keyforge-core" }
keyforge-adapter = { path = "../keyforge-adapter" }
keyforge-physics = { path = "../keyforge-physics" }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
single_threaded = ["keyforge-core/single_threaded"]
