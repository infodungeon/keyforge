[package]
name = "keyforge-core"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description.workspace = true
repository.workspace = true
lints.workspace = true

[dependencies]
keyforge-model = { path = "../keyforge-model" }
keyforge-physics = { path = "../keyforge-physics" }
keyforge-evolution = { path = "../keyforge-evolution", default-features = false }

tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"

[features]
default = []
single_threaded = ["keyforge-evolution/single_threaded"]
