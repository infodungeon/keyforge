[package]
name = "keyforge-core"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Pure orchestration and domain-agnostic helpers providing the glue between physics and evolution."
repository.workspace = true
[lints]
workspace = true

[dependencies]
keyforge-model = { path = "../keyforge-model" }
keyforge-physics = { path = "../keyforge-physics" }
keyforge-evolution = { path = "../keyforge-evolution", default-features = false }

tracing.workspace = true
serde.workspace = true
async-trait.workspace = true

[features]
default = []
single_threaded = ["keyforge-evolution/single_threaded"]

[dev-dependencies]
keyforge-compute = { path = "../keyforge-compute" }
serde_json.workspace = true