[package]
name = "keyforge-evolution"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Evolutionary optimization algorithms and search strategies for generating keyboard layouts."
repository.workspace = true
[lints]
workspace = true

[dependencies]
rand = "0.9"
rand_xoshiro = "0.7"
serde = { version = "1.0", features = ["derive"] }
keyforge-model = { path = "../keyforge-model" }
keyforge-physics = { path = "../keyforge-physics" }
keyforge-protocol = { path = "../keyforge-protocol" }
tracing = { version = "0.1", features = ["attributes"] }
thiserror = "2.0"

[features]
default = []
single_threaded = []

[dev-dependencies]
proptest = "1.9"
serde_json = "1.0"
