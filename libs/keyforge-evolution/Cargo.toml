[package]
name = "keyforge-evolution"
version = "0.8.0"
edition = "2021"

[dependencies]
rand = "0.8"
rand_xoshiro = "0.6"
serde = { version = "1.0", features = ["derive"] }
keyforge-model = { path = "../keyforge-model" }
keyforge-physics = { path = "../keyforge-physics" }
keyforge-protocol = { path = "../keyforge-protocol" }
tracing = { version = "0.1", features = ["attributes"] }
rayon = { version = "1.10", optional = true }

[features]
default = ["rayon"]
single_threaded = []

[dev-dependencies]
proptest = "1.4"
