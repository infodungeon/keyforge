[package]
name = "keyforge-infra"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Shared infrastructure, observability, logging, and common management services for KeyForge components."
repository.workspace = true
[lints]
workspace = true

[dependencies]
once_cell = "1.21"
moka = { version = "0.12", features = ["sync"] }
tokio = { version = "1.48", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = "0.9"
walkdir = "2.5"
tempfile = "3.24"
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
futures = "0.3"
futures-util = "0.3"
thiserror = "2.0"
backoff = { version = "0.4", features = ["tokio"] }
rmp-serde = "1.3"
zstd = "0.13"
notify = "8.2"
bytes = "1.11"
keyforge-model = { path = "../keyforge-model" }
keyforge-protocol = { path = "../keyforge-protocol" }
keyforge-adapter = { path = "../keyforge-adapter" }
keyforge-core = { path = "../keyforge-core" }
keyforge-physics = { path = "../keyforge-physics" }
async-trait = "0.1"

# Valkey Integration
fred = { version = "10.1.0", features = ["enable-rustls", "metrics"] }
postcard = { version = "1.0", features = ["use-std"] }

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
wiremock = "0.6"
temp-env = "0.3"
tokio = { version = "1", features = ["full"] }
