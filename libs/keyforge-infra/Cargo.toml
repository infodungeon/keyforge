[package]
name = "keyforge-infra"
version = "0.8.0"
edition = "2021"

[dependencies]
once_cell = "1.19"
moka = { version = "0.12", features = ["sync"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
csv = "1.3"
walkdir = "2.5"
tempfile = "3.10"
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
futures-util = "0.3"
thiserror = "2.0"
backoff = { version = "0.4", features = ["tokio"] }
rmp-serde = "1.3"
zstd = "0.13"
keyforge-model = { path = "../keyforge-model" }
keyforge-protocol = { path = "../keyforge-protocol" }
keyforge-adapter = { path = "../keyforge-adapter" }
keyforge-core = { path = "../keyforge-core" }
