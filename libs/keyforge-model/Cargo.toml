[package]
name = "keyforge-model"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description.workspace = true
repository.workspace = true
lints.workspace = true
readme = "../../docs/design/keyforge-model/README.md"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
regex = "1.12"
strum = { version = "0.27", features = ["derive"] }
kle-serial = "0.3"
sha2 = "0.10"
hex = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
utoipa = { version = "5.4", features = [
    "preserve_order",
    "preserve_path_order",
] }
ts-rs = { version = "11.1", features = ["serde-compat"], optional = true }
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.9"

[features]
default = []
ts_bindings = ["dep:ts-rs"]
