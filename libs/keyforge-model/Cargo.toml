[package]
name = "keyforge-model"
version = "0.8.0"
edition = "2021"
authors = ["KeyForge Contributors"]
description = "Domain entities and core logic for the KeyForge keyboard layout optimizer."
license = "Apache-2.0"
repository = "https://github.com/keyforge/keyforge"
readme = "../../docs/design/keyforge-model/README.md"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
regex = "1.12"
strum = { version = "0.27", features = ["derive"] }
kle-serial = "0.3"
sha2 = "0.10"
hex = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
utoipa = { version = "5.4", features = [
    "preserve_order",
    "preserve_path_order",
] }
ts-rs = { version = "11.1", features = ["serde-compat"], optional = true }

[dev-dependencies]
proptest = "1.9"

[features]
default = []
ts_bindings = ["dep:ts-rs"]
