[package]
name = "keyforge-model"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Shared domain models, data structures, and types for keyboard layouts and linguistic corpora."
repository.workspace = true
readme = "../../docs/design/keyforge-model/README.md"

[lints]
workspace = true

[dependencies]
keyforge-testing-macros.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-big-array.workspace = true
smallvec.workspace = true
regex.workspace = true
strum.workspace = true
kle-serial.workspace = true
sha2.workspace = true
hex.workspace = true
postcard.workspace = true
utoipa.workspace = true
tracing.workspace = true
async-trait.workspace = true
ts-rs = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
keyforge-testing = { path = "../keyforge-testing" }
proptest.workspace = true

[features]
default = []
ts_bindings = ["dep:ts-rs"]
cli = ["dep:clap"]
testing = ["dep:proptest"]
