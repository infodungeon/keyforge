[package]
name = "keyforge-persistence"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Data persistence layer providing database access and structured local file management."
repository.workspace = true
[lints]
workspace = true

[features]
default = []
server = ["sqlx"]

[dependencies]
keyforge-infra = { path = "../keyforge-infra" }
keyforge-model = { path = "../keyforge-model" }
keyforge-protocol = { path = "../keyforge-protocol" }
keyforge-core = { path = "../keyforge-core" }
keyforge-compute = { path = "../keyforge-compute" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"

# SQLx remains optional for the Agent
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
], optional = true }
tempfile = "3.10"
