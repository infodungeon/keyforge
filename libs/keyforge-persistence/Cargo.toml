[package]
name = "keyforge-persistence"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Persistence layer for KeyForge, handling project state, autosaves, and user data."
repository.workspace = true
[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.48", features = ["fs", "io-util"] }
async-trait = "0.1"
keyforge-model = { path = "../keyforge-model" }
keyforge-core = { path = "../keyforge-core" }
keyforge-physics = { path = "../keyforge-physics" }
keyforge-infra = { path = "../keyforge-infra" }
keyforge-protocol = { path = "../keyforge-protocol" }
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.10"

[features]
default = []
server = []

[dev-dependencies]
# tempfile already in main deps
