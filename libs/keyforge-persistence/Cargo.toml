[package]
name = "keyforge-persistence"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Persistence layer for KeyForge, handling project state, autosaves, and user data."
repository.workspace = true
[lints]
workspace = true

[dependencies]
keyforge-testing-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
keyforge-model = { path = "../keyforge-model" }
keyforge-adapter = { path = "../keyforge-adapter" }
keyforge-infra = { path = "../keyforge-infra" }
keyforge-protocol = { path = "../keyforge-protocol" }
fs2.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
postcard.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "json"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }

[features]
default = []
server = []

[dev-dependencies]

tokio = { workspace = true, features = ["full"] }

serde_json.workspace = true

keyforge-compute = { path = "../keyforge-compute" }

testcontainers = { workspace = true }

testcontainers-modules = { workspace = true, features = ["postgres"] }
