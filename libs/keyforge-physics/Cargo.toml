[package]
name = "keyforge-physics"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Physical modeling, ergonomic analysis, and scoring engine for keyboard layout valuation."
repository.workspace = true
[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
keyforge-model = { path = "../keyforge-model" }

fastrand = "2.3.0"
tracing = { version = "0.1", features = ["attributes"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.9"
rand = "0.9"
rand_chacha = "0.9"
keyforge-infra = { path = "../keyforge-infra" }
keyforge-compute = { path = "../keyforge-compute" }
keyforge-adapter = { path = "../keyforge-adapter" }
keyforge-model = { path = "../keyforge-model", features = ["testing"] }
serde_json = "1.0"
