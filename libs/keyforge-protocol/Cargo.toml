[package]
name = "keyforge-protocol"
version = "0.8.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
utoipa = { version = "4.2", features = [
    "preserve_order",
    "preserve_path_order",
] }
strum = { version = "0.26", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
kle-serial = "0.3.3"
ts-rs = { version = "10.0", features = ["serde-compat"] }
anyhow = "1.0"


[dev-dependencies]
proptest = "1.4"
