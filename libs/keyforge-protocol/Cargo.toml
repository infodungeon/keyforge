[package]
name = "keyforge-protocol"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Communication protocols, API request/response types, and serialization formats for KeyForge services."
repository.workspace = true
readme = "../../docs/design/keyforge-protocol/README.md"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
utoipa = { version = "5.4", features = [
    "preserve_order",
    "preserve_path_order",
] }
strum = { version = "0.27", features = ["derive"] }
ts-rs = { version = "11.1", features = ["serde-compat"], optional = true }
anyhow = "1.0"
keyforge-model = { path = "../keyforge-model" }

[dev-dependencies]
proptest = "1.9"

[features]
default = []
ts_bindings = ["dep:ts-rs", "keyforge-model/ts_bindings"]
