[package]
name = "keyforge-protocol"
version = "0.8.0"
edition = "2021"
authors = ["KeyForge Contributors"]
description = "Data Transfer Objects and API Contract for KeyForge."
license = "Apache-2.0"
repository = "https://github.com/keyforge/keyforge"
readme = "../../docs/design/keyforge-protocol/README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
utoipa = { version = "5.4", features = [
    "preserve_order",
    "preserve_path_order",
] }
strum = { version = "0.27", features = ["derive"] }
ts-rs = { version = "11.1", features = ["serde-compat"], optional = true }
anyhow = "1.0"
keyforge-model = { path = "../keyforge-model" }

[dev-dependencies]
proptest = "1.9"

[features]
default = []
ts_bindings = ["dep:ts-rs", "keyforge-model/ts_bindings"]
