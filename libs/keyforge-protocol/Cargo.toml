[package]
name = "keyforge-protocol"
version = "0.8.0"
edition = "2021"

[dependencies]
regex = "1.10"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0"
kle-serial = "0.3.3"
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
# NEW: API Documentation
utoipa = { version = "4.2", features = [
    "preserve_order",
    "preserve_path_order",
] }

[dev-dependencies]
proptest = "1.4"
