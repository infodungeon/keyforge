[package]
name = "keyforge-security"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "Security, authentication, and cryptographic utilities for secure KeyForge network communications."
repository.workspace = true
[lints]
workspace = true

[dependencies]
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8.5"
hex = "0.4"
sha2 = "0.10"
thiserror = "2.0"
