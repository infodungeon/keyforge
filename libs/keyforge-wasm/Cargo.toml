[package]
name = "keyforge-wasm"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "WebAssembly bindings for running KeyForge layout analysis and scoring in browser environments."
repository.workspace = true
[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keyforge-testing-macros.workspace = true
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
wasm-bindgen.workspace = true
getrandom_v03 = { workspace = true, features = ["wasm_js"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-physics = { path = "../../libs/keyforge-physics" }
keyforge-compute = { path = "../../libs/keyforge-compute", default-features = false }
async-trait.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
