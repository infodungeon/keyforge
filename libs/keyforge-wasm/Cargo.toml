[package]
name = "keyforge-wasm"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
description = "WebAssembly bindings for running KeyForge layout analysis and scoring in browser environments."
repository.workspace = true
[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keyforge-adapter = { path = "../../libs/keyforge-adapter" }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
serde.workspace = true
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

keyforge-protocol = { path = "../../libs/keyforge-protocol" }
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-physics = { path = "../../libs/keyforge-physics" }
keyforge-compute = { path = "../../libs/keyforge-compute", default-features = false, features = [
    "single_threaded",
] }
keyforge-core = { path = "../../libs/keyforge-core" }
async-trait.workspace = true
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json.workspace = true
tokio.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false