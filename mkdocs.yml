site_name: Keyforge
site_url: https://keyforge.infodungeon.com
site_dir: hosts/sites/keyforge

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Welcome: index.md
  - User Guide:
      - Getting Started: user_guide/getting_started.md
      - CLI Reference: user_guide/cli.md
      - Glossary: user_guide/glossary.md
  - Architecture:
      - Overview: architecture/README.md
      - Manifesto: architecture/00_MANIFESTO.md
      - Domain Dictionary: architecture/01_DOMAIN_DICTIONARY.md
      - Entity Relationships: architecture/02_ENTITY_RELATIONSHIPS.md
      - System Context: architecture/03_SYSTEM_CONTEXT.md
      - Design Patterns: architecture/05_DESIGN_PATTERNS.md
      - Data Flow: architecture/04_DATA_FLOW.md
      - API Surface: architecture/06_API_SURFACE.md
      - Security Model: architecture/08_SECURITY_MODEL.md
      - Decision Records: architecture/09_DECISION_RECORDS.md
  - Design:
      - Map: design/ARCHITECTURE_MAP.md
      - Apps:
          - Agent: design/apps/keyforge-agent/README.md
          - AssetMgr: design/apps/keyforge-assetmgr/README.md
          - Assets: design/apps/keyforge-assets/README.md
          - CLI: design/apps/keyforge-cli/README.md
          - Hive: design/apps/keyforge-hive/README.md
          - UI: design/apps/keyforge-ui/README.md
          - TUI: design/apps/keyforge-tui/README.md
      - Libs:
          - Adapter: design/libs/keyforge-adapter/README.md
          - Compute: design/libs/keyforge-compute/README.md
          - Core: design/libs/keyforge-core/README.md
          - Evolution: design/libs/keyforge-evolution/README.md
          - Export: design/libs/keyforge-export/README.md
          - Infra: design/libs/keyforge-infra/README.md
          - Model: design/libs/keyforge-model/README.md
          - Persistence: design/libs/keyforge-persistence/README.md
          - Physics: design/libs/keyforge-physics/README.md
          - Protocol: design/libs/keyforge-protocol/README.md
          - Runner: design/libs/keyforge-runner/README.md
          - Security: design/libs/keyforge-security/README.md
          - Testing: design/libs/keyforge-testing/README.md
          - Wasm: design/libs/keyforge-wasm/README.md
  - Development:
      - Setup: development/01_SETUP_ARCH.md
      - Automation: development/03_JUSTFILE_AUTOMATION.md
      - Sandbox: development/05_SANDBOX_MECHANISM.md
      - Docker Strategy: development/04_DOCKER_STRATEGY.md
  - Engineering:
      - Context: engineering/KEYFORGE_CONTEXT.md
      - LLM Reliability: engineering/doctrine_llm_reliability.md
  - Planning:
      - Backlog: planning/index.md
      - Redis Strategy: planning/redis.md