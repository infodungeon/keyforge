services:
  # The Database
  db:
    image: postgres:16-alpine
    container_name: keyforge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-keyforge_hive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Coordination Layer (Valkey)
  valkey:
    image: valkey/valkey:8
    container_name: keyforge_valkey
    restart: always
    ports:
      - "6379:6379"
    command: valkey-server --requirepass "${VALKEY_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Asset Manager
  assetmgr:
    build:
      context: ..
      dockerfile: ops/Dockerfile.assetmgr
    container_name: keyforge_assetmgr
    restart: always
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      KEYFORGE_VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      KEYFORGE_DATA_DIR: /app/data
    volumes:
      - ../data:/app/data

  # Asset Server
  assets:
    build:
      context: ..
      dockerfile: ops/Dockerfile.assets
    container_name: keyforge_assets
    restart: always
    depends_on:
      assetmgr:
        condition: service_started
      valkey:
        condition: service_healthy
    environment:
      KEYFORGE_VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      PORT: 3001
    networks:
      default:
        aliases:
          - assets_upstream

  # Hive
  hive:
    build:
      context: ..
      dockerfile: ops/Dockerfile.hive
    container_name: keyforge_hive
    restart: always
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-keyforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-keyforge_hive}
      HIVE_SECRET: ${HIVE_SECRET:-}
      RUST_LOG: info,keyforge_hive=debug
      KEYFORGE_VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
    volumes:
      - ../data:/app/data
    networks:
      default:
        aliases:
          - hive_upstream

  # The Web server (Gateway)
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    container_name: keyforge_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../hosts/sites:/usr/local/apache2/htdocs:ro
      - ../hosts/certs:/etc/apache2/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
