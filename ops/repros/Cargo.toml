[package]
name = "keyforge-repros"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repro_score"
path = "repro_score.rs"

[[bin]]
name = "check_keycodes"
path = "check_keycodes.rs"

[[bin]]
name = "compile_keycodes"
path = "compile_keycodes.rs"

[[bin]]
name = "fix_keycodes"
path = "fix_keycodes.rs"

[[bin]]
name = "generate_keycodes"
path = "generate_keycodes.rs"

[[bin]]
name = "check_geometry"
path = "check_geometry.rs"

[[bin]]
name = "fix_szr35_geometry"
path = "fix_szr35_geometry.rs"

[[bin]]
name = "audit_geometry"
path = "audit_geometry.rs"

[[bin]]
name = "space_optimality"
path = "space_optimality.rs"

[[bin]]
name = "verify_weights"
path = "verify_weights.rs"

[[bin]]
name = "verify_biometrics"
path = "verify_biometrics.rs"

[[bin]]
name = "dump_layout"
path = "dump_layout.rs"

[[bin]]
name = "dump_ui_categories"
path = "dump_ui_categories.rs"

[dependencies]
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-compute = { path = "../../libs/keyforge-compute" }
keyforge-physics = { path = "../../libs/keyforge-physics" }
keyforge-infra = { path = "../../libs/keyforge-infra" }
keyforge-protocol = { path = "../../libs/keyforge-protocol" }
serde_json = "1.0"
rmp-serde = "1.3"
zstd = "0.13"
tokio = { workspace = true, features = ["full"] }
regex = "1.12.2"
