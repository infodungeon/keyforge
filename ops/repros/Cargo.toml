[package]
name = "keyforge-repros"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repro_score"
path = "repro_score.rs"

[[bin]]
name = "check_keycodes"
path = "check_keycodes.rs"

[[bin]]
name = "compile_keycodes"
path = "compile_keycodes.rs"

[[bin]]
name = "fix_keycodes"
path = "fix_keycodes.rs"

[[bin]]
name = "check_geometry"
path = "check_geometry.rs"

[dependencies]
keyforge-model = { path = "../../libs/keyforge-model" }
keyforge-core = { path = "../../libs/keyforge-core" }
serde_json = "1.0"
rmp-serde = "1.3"
zstd = "0.13"
